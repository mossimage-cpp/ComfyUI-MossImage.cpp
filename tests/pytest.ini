# Run as `pytest tests` from the pack folder: tests/ is the rootdir, so pytest
# never imports the pack's own __init__.py (that needs ComfyUI).
[pytest]
addopts = --import-mode=importlib -p no:cacheprovider
markers =
    e2e: starts the user's ComfyUI headless (fake or real moss-server)
    gpu: runs the real moss-server on the GPU
